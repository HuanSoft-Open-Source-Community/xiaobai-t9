translator:
  dictionary: xiaobai_simp
  prism: xiaobai_simp
  spelling_hints: 99
  preedit_format:
    - xform/7/'/
  comment_format:
    - xform/7/'/
    
    # 开启自动造词相关设置，将下面四项都改为 true
  # enable_user_dict: true
  # enable_sentence: true
  # enable_encoder: true
  # encode_commit_history: true
  
  # max_phrase_length: 6
  # user_dict: user                              # 用户词典名
  # db_class: tabledb
  # disable_user_dict_for_patterns:       # 不需要录入用户词典的编码
    # - "^z.*$"
  
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

simplifier:
  option_name: zh_simp

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # - { when: always, accept: Control+Shift+4, toggle: zh_simp }
    # - { when: always, accept: Control+Shift+dollar, toggle: zh_simp }
    - {accept: KP_0, send: space, when: has_menu}
    - {accept: KP_1, send: 1, when: always}
    - {accept: KP_2, send: 2, when: always}
    - {accept: KP_3, send: 3, when: always}
    - {accept: KP_4, send: 4, when: always}
    - {accept: KP_5, send: 5, when: always}
    - {accept: KP_6, send: 6, when: always}
    - {accept: KP_7, send: 7, when: always}
    - {accept: KP_8, send: 8, when: always}
    - {accept: KP_9, send: 9, when: always}


    #把大键盘数字映射成小键盘数字
    - {accept: 1, send: KP_1, when: has_menu}
    - {accept: 2, send: KP_2, when: has_menu}
    - {accept: 3, send: KP_3, when: has_menu}
    - {accept: 4, send: KP_4, when: has_menu}
    - {accept: 5, send: KP_5, when: has_menu}
    - {accept: 6, send: KP_6, when: has_menu}
    - {accept: 7, send: KP_7, when: has_menu}
    - {accept: 8, send: KP_8, when: has_menu}
    - {accept: 9, send: KP_9, when: has_menu}

    - {accept: 1, send_sequence: "{1}{Return}", when: always}
    - {accept: 2, send_sequence: "{2}{Return}", when: always}
    - {accept: 3, send_sequence: "{3}{Return}", when: always}
    - {accept: 4, send_sequence: "{4}{Return}", when: always}
    - {accept: 5, send_sequence: "{5}{Return}", when: always}
    - {accept: 6, send_sequence: "{6}{Return}", when: always}
    - {accept: 7, send_sequence: "{7}{Return}", when: always}
    - {accept: 8, send_sequence: "{8}{Return}", when: always}
    - {accept: 9, send_sequence: "{9}{Return}", when: always}
    - {accept: 0, send_sequence: "{0}{Return}", when: always}


    - {accept: KP_Divide, send: Page_Up, when: has_menu}
    - {accept: KP_Multiply, send: Page_Down, when: has_menu}
    - {accept: KP_Subtract, send: Up, when: has_menu}
    - {accept: KP_Add, send: Down, when: has_menu}
    - {accept: Left, send: Left, when: has_menu}
    - {accept: Right, send: Right, when: has_menu}
    # 没有候选（比如输入码打不出字）时也要能退格：composing 覆盖"正在输入"的所有情况
    - {accept: KP_Decimal, send: BackSpace, when: composing}
    - {accept: KP_Decimal, send: BackSpace, when: has_menu}
    - {accept: KP_Enter, send: Return, when: has_menu}